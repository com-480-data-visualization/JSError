<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>European Social & Economic Data Explorer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullPage.js/3.1.2/fullpage.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Georgia+Pro:wght@400&display=swap');
    html, body, #fullpage {
      height: 100%;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .section {
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #section1 {
      background-image: url('./images/home_background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    footer {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; 
      text-align: center; 
      padding: 10px 0; 
      width: 100%; 
      height: 60px;  
      font-size: 20px;  
      line-height: 60px;  
      position: relative;  
    }
    .footer-content {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Major Mono Display", sans-serif;  
    }
    .footer-content a {
      color: rgb(255, 255, 255);
      margin: 0 10px;
      text-decoration: none;
      font-size: 30px;
    }
    .footer-content span {
      font-size: 20px;  
      font-weight: bold;  
    }
    .footer-content span:not(:last-child)::after {
      content: " | ";
      margin: 0 5px;
    }

    /* Custom styles for fullPage.js navigation dots */
    .fp-right .fp-tooltip {
      color: white !important;
      font-family: "Major Mono Display", sans-serif !important;
      font-size: 16px !important;
    }
    .fp-right li a span {
      background: white !important;
    }
    .fp-right li a.active span {
      background: white !important;
    }
  </style>
</head>
<body>
  <div id="fullpage">
    <div class="section" id="section1">
      <iframe src="home.html"></iframe>
    </div>
    <div class="section" id="section2">
      <iframe src="about.html"></iframe>
    </div>
    <div class="section" id="section3">
      <iframe src="data-overview.html"></iframe>
    </div>
    <div class="section" id="section4">
      <iframe src="interactive-map.html"></iframe>
    </div>
  </div>
  <footer>
    <div class="footer-content">
      <a href="https://github.com/your-repo" target="_blank">
        <i class="fab fa-github"></i>
      </a>
      <span>Team JSError</span>
    </div>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fullPage.js/3.1.2/fullpage.min.js"></script>
  <script>
    new fullpage('#fullpage', {
      navigation: true,
      navigationPosition: 'right',
      navigationTooltips: ['Home', 'About', 'Data Overview', 'Interactive Map', 'Footer'],
      showActiveTooltip: true,
      scrollingSpeed: 700,
      autoScrolling: true,
      scrollBar: true,
      fitToSection: true,
      fitToSectionDelay: 100,
      responsiveWidth: 0,
      responsiveHeight: 0,
      responsiveSlides: false,
    });
  </script>
</body>
